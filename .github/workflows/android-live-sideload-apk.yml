name: Android Live Sideload APK

on:
  push:
    branches:
      - artifact/android-live-shell-20261101
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Create minimal Capacitor live-service shell
        shell: bash
        run: |
          rm -rf /tmp/android-shell
          mkdir -p /tmp/android-shell/dist
          cd /tmp/android-shell
          npm init -y
          npm install --ignore-scripts @capacitor/core@7.4.4 @capacitor/cli@7.4.4 @capacitor/android@7.4.4
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.bobbysworld.atlasverify",
            "appName": "AtlasVerify",
            "webDir": "dist",
            "server": {
              "url": "https://atlasverify-web-production.up.railway.app",
              "cleartext": false,
              "androidScheme": "https"
            }
          }
          EOF
          cat > dist/index.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AtlasVerify</title></head><body><p>Loading AtlasVerify…</p></body></html>
          EOF
          npx cap add android
          npx cap sync android
      - name: Build installable debug APK
        shell: bash
        run: |
          cd /tmp/android-shell/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/AtlasVerify-sideload.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: atlasverify-sideload-apk
          path: AtlasVerify-sideload.apk
          if-no-files-found: error
