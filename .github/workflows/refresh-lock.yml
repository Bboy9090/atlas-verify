name: Refresh npm lock

on:
  push:
    branches:
      - release/pwa-store-readiness-20261031

permissions:
  contents: write

jobs:
  refresh:
    if: "${{ !contains(github.event.head_commit.message, 'chore: synchronize npm lockfile') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/pwa-store-readiness-20261031
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize npm lockfile"
          git push origin HEAD:release/pwa-store-readiness-20261031
